# Rooted & Green — static SPA vhost
# __SERVER_NAME__ / __DEFAULT__ are substituted by deploy/provision.sh.
# With no domain, server_name becomes "_" and this vhost is the default_server,
# so it answers requests made straight to the IP.
#
# certbot --nginx will rewrite this file to add the TLS server block and the
# :80 -> :443 redirect. Re-running provision.sh would overwrite that, so edit
# the live file directly after certbot has run.

server {
    listen 80__DEFAULT__;
    listen [::]:80__DEFAULT__;
    server_name __SERVER_NAME__;

    root /var/www/rooted-and-green;
    index index.html;

    access_log /var/log/nginx/rooted-and-green.access.log;
    error_log  /var/log/nginx/rooted-and-green.error.log;

    # Client-side routing: /projects/:slug and /admin are React Router routes with
    # no file behind them. Serve index.html and let the router resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything in /assets, so it is safe to cache forever.
    location /assets/ {
        access_log off;
        # One directive only: `expires` would emit a second Cache-Control header.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The HTML entry point must never be cached, or deploys go unnoticed.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Let's Encrypt HTTP-01 challenges (rsync --delete excludes this path).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rooted-and-green;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known) {
        deny all;
    }
}
